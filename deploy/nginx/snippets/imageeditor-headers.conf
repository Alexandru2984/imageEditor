# Security headers for imageeditor.micutu.com, installed to
# /etc/nginx/snippets/imageeditor-headers.conf by scripts/install-nginx.sh.
# Every location that sets its own header must include this file again.
#
# The editor needs only two capabilities beyond 'self': WebAssembly
# compilation and downloads of the pinned background-removal model from
# Hugging Face (huggingface.co redirects to *.hf.co, both CORS-enabled, which
# cross-origin isolation requires). Inline scripts stay forbidden; the theme
# bootstrap is an external file. Inline styles are needed by Fabric and Radix.
# Keep this in step with the preview headers in vite.config.ts, which the E2E
# suite checks.
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://huggingface.co/briaai/RMBG-1.4/resolve/2ceba5a5efaec153162aedea169f76caf9b46cf8/ https://*.hf.co; worker-src 'self' blob:; manifest-src 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=(), serial=(), hid=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Origin-Agent-Cluster "?1" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
