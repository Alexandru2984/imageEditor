# Standalone parser harness for the versioned site. From the repository root:
#   sudo nginx -t -p "$PWD/deploy/nginx/" -c nginx.test.conf
# Relative includes resolve against deploy/nginx/ here and /etc/nginx/ once
# installed, so the repository's snippets are what gets validated.
pid /tmp/imageeditor-nginx-config-test.pid;
error_log stderr;

events {}

http {
    include /etc/nginx/mime.types;
    include sites-available/imageeditor.micutu.com-canary;
}
