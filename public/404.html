<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Image Editor</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root { color-scheme: light dark; --bg: #f7f7fb; --fg: #16151d; --muted: #5d5b6b; --accent: #7c3aed; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0c0b11; --fg: #f3f2f8; --muted: #a3a1b3; --accent: #a78bfa; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { text-align: center; max-width: 28rem; }
      h1 { font-size: 3.5rem; margin: 0 0 .25rem; letter-spacing: -.03em; }
      p { color: var(--muted); margin: 0 0 1.5rem; }
      a { display: inline-block; padding: .65rem 1.25rem; border-radius: .6rem; background: var(--accent); color: #fff;
        text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page does not exist. The editor lives on the home page.</p>
      <a href="/">Open the editor</a>
    </main>
  </body>
</html>
